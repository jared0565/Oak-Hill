<!--
  Standard <head> for every public page of the BytesFX Café & Bookings demo.

  Replace the {{...}} tokens. Keep the canonical origin consistent across the
  whole site: ORIGIN is the URL the deployment actually serves. If a custom
  domain is attached to the Pages project, change it here and in every page
  at the same time.

  ORIGIN = https://oak-hill-park-cafe.pages.dev
-->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="{{ORIGIN}}/{{PAGE}}">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#1d4633">
  <meta property="og:site_name" content="BytesFX Café &amp; Bookings">
  <meta property="og:locale" content="en_GB">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ORIGIN}}/{{PAGE}}">
  <meta property="og:title" content="{{OG_TITLE}}">
  <meta property="og:description" content="{{OG_DESCRIPTION}}">
  <meta property="og:image" content="{{ORIGIN}}/assets/og/{{OG_IMAGE}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{OG_IMAGE_ALT}}">
  <meta name="twitter:card" content="summary_large_image">
  <!-- The display face is preloaded so the headings arrive in Fraunces with
       the first paint, rather than swapping from the fallback after it. -->
  <link rel="preload" href="assets/fonts/fraunces-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/styles.css">
  <!-- Loaded without defer, on purpose: the mode has to be set before the
       first paint, so the page never flashes the wrong one. -->
  <script src="assets/theme.js"></script>
